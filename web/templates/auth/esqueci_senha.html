<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha — Flux</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { DEFAULT: '#10b981', dark: '#059669' } } } }
    }
  </script>
</head>
<body class="h-full bg-gray-900 flex items-center justify-center p-4">

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
      {% for category, message in messages %}
        <div class="flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-sm font-medium
          {% if category == 'error' %}bg-red-500/20 border border-red-500/40 text-red-300
          {% elif category == 'success' %}bg-emerald-500/20 border border-emerald-500/40 text-emerald-300
          {% else %}bg-blue-500/20 border border-blue-500/40 text-blue-300{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand mb-4">
      <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-white">Recuperar senha</h1>
    <p class="text-gray-400 text-sm mt-1">Enviaremos um link para o seu e-mail</p>
  </div>

  <div class="bg-gray-800 rounded-2xl border border-gray-700 p-8">
    <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-1.5">E-mail da conta</label>
        <input
          type="email" id="email" name="email" required autocomplete="email" autofocus
          class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2.5 text-sm text-white
                 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition"
          placeholder="seu@email.com">
      </div>

      <button type="submit"
              class="w-full bg-brand hover:bg-brand-dark text-white font-semibold rounded-lg py-2.5 text-sm
                     transition-colors focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2 focus:ring-offset-gray-800">
        Enviar link de recuperação
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      <a href="{{ url_for('auth.login') }}" class="text-brand hover:text-emerald-400 font-medium transition-colors">
        Voltar ao login
      </a>
    </p>
  </div>
</div>

</body>
</html>
