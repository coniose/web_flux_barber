[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxo_barber"
version = "0.1.0"
description = "Gestão financeira offline para a barbearia brodz"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.coverage.run]
source = ["app"]
omit = ["app/ui/*", "app/main.py"]
